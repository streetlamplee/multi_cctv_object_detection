<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상단 정렬 실시간 이미지 갤러리</title>
    <style>
        /* 기본 여백 제거 */
        html, body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* [수정] 제목 스타일 변경 */
        h1 {
            text-align: center;
            margin: 0;
            padding: 20px 0; /* 상하 여백 20px, 좌우 여백 0 */
            /* height: 10%; <- 이 속성을 제거하여 불필요한 공간 차지를 없앰 */
        }

        /* 이미지를 감싸는 컨테이너 */
        #image-container {
            width: 100%;
            height: 75vh; /* 뷰포트(웹페이지 보이는 영역) 높이의 75% */
        }

        /* 테이블 스타일 */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        /* 테이블 셀(td) 스타일 */
        td {
            padding: 2px;
            box-sizing: border-box;
        }
        
        /* 이미지 스타일 */
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; 
        }
    </style>
</head>
<body>

    <h1>NVR IMAGE STREAM</h1>
    <div id="image-container"></div>

    <script>
        const imageContainer = document.getElementById('image-container');
        const imageFolderPath = 'output/';
        const totalImages = 12;
        const columns = 4;
        const rows = 3;

        // --- 1. 초기 이미지 그리드 생성 ---
        const table = document.createElement('table');
        let imageCounter = 0;

        for (let i = 0; i < rows; i++) {
            const row = document.createElement('tr');
            for (let j = 0; j < columns; j++) {
                const cell = document.createElement('td');
                const img = document.createElement('img');
                
                const imageIndex = imageCounter + 1;
                const fileName = String(imageIndex).padStart(2, '0') + '.jpg';

                img.id = 'img-' + imageIndex; 
                img.src = imageFolderPath + fileName;
                img.alt = `이미지 ${imageIndex}`;

                cell.appendChild(img);
                row.appendChild(cell);
                imageCounter++;
            }
            table.appendChild(row);
        }
        imageContainer.appendChild(table);


        // --- 2. 1초마다 모든 이미지를 업데이트하는 로직 ---
        const refreshInterval = 1000;

        setInterval(() => {
            const timestamp = new Date().getTime(); 
            for (let i = 1; i <= totalImages; i++) {
                const imageElement = document.getElementById('img-' + i);
                if (imageElement) {
                    const fileName = String(i).padStart(2, '0') + '.jpg';
                    imageElement.src = imageFolderPath + fileName + '?t=' + timestamp;
                }
            }
        }, refreshInterval);
    </script>

</body>
</html>
